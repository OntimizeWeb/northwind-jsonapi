<div class="container">
<o-form-container breadcrumb="yes" breadcrumb-label-columns="CompanyName" breadcrumb-separator=", " class="fill-form">
      <o-form #form attr="Customer_form_edit" 
        service="Customer" 
        entity="Customer" 
        fxLayout="column" 
        show-header="yes" 
        header-actions="R;I;U;D"
        #oDetailForm keys="Id" 
        keys-sql-types="VARCHAR" 
        show-header-navigation="yes"
        (onDataLoaded)="onDataLoaded($event)">

  <o-row attr="row1" layout-align="start stretch">
    <div fxLayout="row wrap" fxLayoutAlign="start start" fxFlex fxLayoutGap="14px">
      
      <o-text-input #Id attr="Id" label="Id " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-currency-input #Balance attr="Balance" title="Balance " type="currency" editable="no" required="no" currency-symbol="$" currency-symbol-position="left" thousand-separator="," decimal-separator="."></o-currency-input>
      
      <o-integer-input #OrderCount attr="OrderCount" label="Ordercount " type="integer" editable="no" required="no" ></o-integer-input>
      
      <o-integer-input #Client_id attr="Client_id" label="Client Id " type="integer" editable="no" required="no" ></o-integer-input>
      
      <o-text-input #ContactTitle attr="ContactTitle" label="Contacttitle " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-text-input #City attr="City" label="City " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-text-input #PostalCode attr="PostalCode" label="Postalcode " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-text-input #Phone attr="Phone" label="Phone " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-text-input #CompanyName attr="CompanyName" label="Company Name* " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-currency-input #CreditLimit attr="CreditLimit" title="Creditlimit " type="currency" editable="no" required="no" currency-symbol="$" currency-symbol-position="left" thousand-separator="," decimal-separator="."></o-currency-input>
      
      <o-integer-input #UnpaidOrderCount attr="UnpaidOrderCount" label="Unpaidordercount " type="integer" editable="no" required="no" ></o-integer-input>
      
      <o-text-input #ContactName attr="ContactName" label="Contactname " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-text-input #Address attr="Address" label="Address " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-text-input #Region attr="Region" label="Region " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-text-input #Country attr="Country" label="Country " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-text-input #Fax attr="Fax" label="Fax " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
    </div>
  </o-row>
      
      <mat-tab-group fxFill>
        
        <mat-tab label="ORDER-CustomerId">
    <div layout-padding>
      <o-table 
        attr="OrderTable" 
        service="Order" 
        entity="Order" 
        keys="Id"
        parent-keys="CustomerId:Id"
        columns="EmployeeId;OrderDate;Ready;OrderDetailCount;Country;RequiredDate;ShipName;ShipAddress;ShipRegion;ShipCountry;Id;ShippedDate;AmountTotal;CloneFromOrder;Freight;City;CustomerId;ShipVia;ShipCity;ShipZip"  
        horizontal-scroll="yes"
        detail-form-route="Order" 
        edit-form-route="Order"
        visible-columns="EmployeeId;OrderDate;Ready;OrderDetailCount;Country;RequiredDate;ShipName;ShipAddress;ShipRegion;ShipCountry;Id;ShippedDate;AmountTotal;CloneFromOrder;Freight;City;CustomerId;ShipVia;ShipCity;ShipZip"  
        sort-columns="Id" 
        query-rows="25" 
        quick-filter="yes"
        row-height="medium" 
        select-all-checkbox="true" 
        pageable="yes"  
        auto-adjust="true" 
        virtual-scroll="yes" 
        insert-button="yes" 
        delete-button="yes" 
        fixed-header="true" 
        class="vertical-padding-8"
        edition-mode="dblclick" 
        horizontal-scroll="yes" class="fill-form">
        
          <o-table-column attr="EmployeeId" title="Employee">
    <o-table-cell-renderer-service attr="EmployeeId" 
        service="Employee" entity="EmployeeType" columns="Id;LastName"
        parent-keys="Id:EmployeeId"
        value-column="LastName" keys="EmployeeId"
        visible-columns="LastName" separator=" - " width="680px">
    </o-table-cell-renderer-service>
</o-table-column>
        
          <o-date-input #OrderDate attr="OrderDate" type="date" label="Orderdate " enabled="yes" required="no" format="LL" fxFlex="20%" class="form-field"></o-date-input>
        
          <o-table-column #Ready attr="Ready" title="Ready " editable="no" required="no" content-align="left"></o-table-column>
        
          <o-table-column #OrderDetailCount attr="OrderDetailCount" title="Orderdetailcount " type="integer" editable="no" required="no" content-align="center"></o-table-column>
        
          <o-table-column #Country attr="Country" title="Country " editable="no" required="no" content-align="left"></o-table-column>
        
          <o-date-input #RequiredDate attr="RequiredDate" type="date" label="Requireddate " enabled="yes" required="no" format="LL" fxFlex="20%" class="form-field"></o-date-input>
        
          <o-table-column #ShipName attr="ShipName" title="Ship Name* " editable="no" required="no" content-align="left"></o-table-column>
        
          <o-table-column #ShipAddress attr="ShipAddress" title="Shipaddress " editable="no" required="no" content-align="left"></o-table-column>
        
          <o-table-column #ShipRegion attr="ShipRegion" title="Shipregion " editable="no" required="no" content-align="left"></o-table-column>
        
          <o-table-column #ShipCountry attr="ShipCountry" title="Shipcountry " editable="no" required="no" content-align="left"></o-table-column>
        
          <o-table-column #Id attr="Id" title="Id " type="integer" editable="no" required="no" content-align="center"></o-table-column>
        
          <o-date-input #ShippedDate attr="ShippedDate" type="timestamp" label="Shippeddate " editable="no" required="no" format="LL" fxFlex="20%" class="form-field"></o-date-input>
        
          <o-table-column #AmountTotal attr="AmountTotal" title="Amounttotal " type="currency" editable="no" required="no" currency-symbol="$" currency-symbol-position="left" thousand-separator=","decimal-separator="."></o-table-column>
        
          <o-table-column #CloneFromOrder attr="CloneFromOrder" title="Clonefromorder " type="integer" editable="no" required="no" content-align="center"></o-table-column>
        
          <o-table-column #Freight attr="Freight" title="Freight " type="currency" editable="no" required="no" currency-symbol="$" currency-symbol-position="left" thousand-separator=","decimal-separator="."></o-table-column>
        
          <o-table-column #City attr="City" title="City " editable="no" required="no" content-align="left"></o-table-column>
        
          <o-table-column attr="CustomerId" title="Customer">
    <o-table-cell-renderer-service attr="CustomerId" 
        service="Customer" entity="CustomerType" columns="Id;CompanyName"
        parent-keys="Id:CustomerId"
        value-column="CompanyName" keys="CustomerId"
        visible-columns="CompanyName" separator=" - " width="680px">
    </o-table-cell-renderer-service>
</o-table-column>
        
          <o-table-column #ShipVia attr="ShipVia" title="Shipvia " type="integer" editable="no" required="no" content-align="center"></o-table-column>
        
          <o-table-column #ShipCity attr="ShipCity" title="Shipcity " editable="no" required="no" content-align="left"></o-table-column>
        
          <o-table-column #ShipZip attr="ShipZip" title="Shipzip " editable="no" required="no" content-align="left"></o-table-column>
        
        <o-table-paginator page-size-options="25;50;100"></o-table-paginator>
      </o-table>
    </div>
</mat-tab>
        
      </mat-tab-group>
      
    </o-form>
  </o-form-container>
</div>

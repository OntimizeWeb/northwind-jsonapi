<o-form #SupplierForm attr="Supplier_form_insert" service="Supplier" entity="Supplier" 
keys="Id" fxLayout="column" show-header="yes" header-actions="I"
horizontal-scroll="yes"
after-insert-mode="new" class="standalone-form-container" (onInsertMode)="onInsertMode()">

<o-row attr="row1" layout-align="start stretch">
  <div fxLayout="row wrap" fxLayoutAlign="start start" fxFlex fxLayoutGap="14px">
    
        <o-text-input #Address attr="Address" label="Address " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
        <o-text-input #Country attr="Country" label="Country " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
        <o-integer-input #Id attr="Id" label="Id " type="integer" editable="no" required="no" ></o-integer-input>
      
        <o-text-input #ContactTitle attr="ContactTitle" label="Contacttitle " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
        <o-text-input #PostalCode attr="PostalCode" label="Postalcode " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
        <o-text-input #HomePage attr="HomePage" label="Homepage " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
        <o-text-input #ContactName attr="ContactName" label="Contactname " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
        <o-text-input #Region attr="Region" label="Region " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
        <o-text-input #Fax attr="Fax" label="Fax " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
        <o-text-input #CompanyName attr="CompanyName" label="Company Name " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
        <o-text-input #City attr="City" label="City " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
        <o-text-input #Phone attr="Phone" label="Phone " enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
</div>
</o-row>

<div layout-padding></div>

</o-form>
